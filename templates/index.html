<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pattern Trader Console</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-chart-line"></i>
                <span>Pattern<span class="accent">Trader</span></span>
            </div>
            <div class="nav-links">
                <span class="badge-live"><i class="fas fa-circle"></i> LIVE</span>
                <span class="time-display" id="serverTime"></span>
            </div>
        </nav>

        <div class="controls">
            <div class="control-group">
                <label><i class="fas fa-robot"></i> Auto‑Trade</label>
                <div class="toggle-container">
                    <label class="toggle-switch">
                        <input type="checkbox" id="autoTradeToggle">
                        <span class="slider"></span>
                    </label>
                    <span id="autoTradeStatus">Disabled</span>
                </div>
            </div>
            <button id="refreshBtn" class="btn-primary"><i class="fas fa-sync-alt"></i> Generate Signals</button>
        </div>

        <div id="loading" class="loading-card hidden">
            <i class="fas fa-spinner fa-pulse"></i> Loading signals...
        </div>
        <div id="errorMsg" class="error-card hidden"></div>
        <div id="summary" class="summary-section"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
